<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // URLパラメータ ?to= を読み取り、Workersへ転送
    const params = new URLSearchParams(window.location.search);
    const to = params.get('to') || 'https://github.com';
    const workerUrl = 'https://your-tracker.your-subdomain.workers.dev';
    window.location.replace(`${workerUrl}/?to=${encodeURIComponent(to)}`);
  </script>
</head>
<body><p>Redirecting...</p></body>
</html>
